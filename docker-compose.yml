services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_support}
      POSTGRES_USER: ${POSTGRES_USER:-customer_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_support}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  customer-support-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-customer_support}
      DB_USERNAME: ${POSTGRES_USER:-customer_support}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-customer_support}
      SERVER_PORT: 8080

      AGENT_ENABLED: ${AGENT_ENABLED:-true}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-5.4-nano}
      OPEN_AI_EMBEDDING_MODEL: ${OPEN_AI_EMBEDDING_MODEL:-text-embedding-3-small}

      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.60}
    ports:
      - "8080:8080"
