services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_support}
      POSTGRES_USER: ${POSTGRES_USER:-customer_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_support}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  customer-support-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-customer_support}
      DB_USERNAME: ${POSTGRES_USER:-customer_support}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-customer_support}
      SERVER_PORT: 8080
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
