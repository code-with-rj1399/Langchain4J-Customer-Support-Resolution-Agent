<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Copilot</title><style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--border:#252c34;--text:#f4f6f8;--muted:#8e99a6;--accent:#7c5cff;--ok:#4ade80;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{border-right:1px solid var(--border);background:#0d1014;padding:20px 14px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#4f46e5);display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.section{font-size:10px;color:#687482;text-transform:uppercase;letter-spacing:.12em;margin:18px 8px 8px}.new,.case{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:10px;text-align:left;cursor:pointer;margin-bottom:7px}.case:hover,.new:hover,.case.selected{background:var(--panel2);border-color:#7c5cff}.case b{font-size:12px}.case small{color:var(--muted);line-height:1.5}.amount{float:right;color:#c7bfff}.top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.pill{border:1px solid var(--border);background:var(--panel);padding:6px 10px;border-radius:999px;font-size:11px}.chat{width:min(920px,100%);margin:auto;padding:32px 28px 160px}.hero h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}.hero p{color:var(--muted);font-size:14px}.mode{display:flex;gap:5px;background:var(--panel);border:1px solid var(--border);padding:5px;border-radius:12px;width:max-content;margin:20px 0}.mode button{border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:8px;cursor:pointer}.mode button.active{background:var(--accent);color:#fff}.messages{display:flex;flex-direction:column;gap:20px}.msg{display:grid;grid-template-columns:34px 1fr;gap:12px}.avatar{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:800}.msg.user .avatar{background:#202737}.head{font-size:12px;font-weight:700;margin-bottom:6px}.time{color:#697582;font-weight:400;margin-left:8px}.bubble{font-size:14px;line-height:1.75;color:#dce1e7}.bubble p{margin:0 0 11px}.bubble ul{margin:5px 0 13px;padding-left:23px}.bubble li{margin:6px 0}.bubble strong{color:#fff}.loading,.approval{margin-top:13px;border:1px solid var(--border);border-radius:12px;background:#0f1317;overflow:hidden}.loading{padding:15px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #353d49;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.bar{height:4px;background:#252c34;border-radius:99px;overflow:hidden;margin-top:13px}.bar i{display:block;height:100%;width:35%;background:var(--accent);animation:load 1.4s ease-in-out infinite}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(400%)}}.approval{padding:14px}.approval p{font-size:12px;color:var(--muted);margin:7px 0}.approval-actions{display:flex;gap:8px;margin-top:12px}.approve,.reject{border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:700}.approve{background:var(--ok);color:#07110a}.reject{background:#2a171c;color:#fff}.composer{position:fixed;left:300px;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:28px}.box{width:min(920px,100%);margin:auto;background:#14191f;border:1px solid #2b333d;border-radius:15px;padding:10px}textarea{width:100%;min-height:45px;resize:none;background:transparent;border:0;outline:0;color:#fff;font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;color:#65707c;font-size:10px}.send{width:38px;height:38px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:800}.error{color:var(--danger);font-size:12px;margin-top:8px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.composer{left:0}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">AI</div><div><b>Support Copilot</b><small>Human-in-the-Loop Lab</small></div></div><button class="new" onclick="newChat()">＋ New conversation</button><div class="section">Demo cases</div><div id="cases"></div><div class="section">Pending approvals</div><div id="approvals"><small style="color:#687482">Loading…</small></div></aside><main><header class="top"><b>Customer Support Resolution</b><span class="pill" id="pill">Single Agent</span></header><section class="chat"><div class="hero" id="hero"><h1>Resolve customer issues with AI.</h1><p>Choose an architecture, then try one of the seeded production-style cases.</p><div class="mode"><button id="single" class="active">Single Agent</button><button id="multi">Multi-Agent</button></div><p id="desc">Orchestrator → Tools</p></div><div class="messages" id="messages"></div></section></main></div><div class="composer"><form class="box" id="form"><textarea id="input" placeholder="Talk to the support system…"></textarea><div class="actions"><span>Enter to send · Shift + Enter for new line</span><button class="send" id="send">↑</button></div><div class="error" id="error"></div></form></div><script>
(()=>{let mode='single',selectedOrder=null;const $=x=>document.getElementById(x),messages=$('messages'),input=$('input'),send=$('send');const demoCases=[['1001','Delivered order','Order 1001 was delivered. Can you check its status?'],['1002','Refund request','My order 1002 is five days late. I want a refund.'],['1003','Shipment tracking','Can you check the status of order 1003?'],['1004','One-day delay','My order 1004 is one day late. I want a refund.'],['1005','Four-day delay','My order 1005 is four days late. I want a refund.'],['1006','High-value refund','My order 1006 is seven days late. I want a refund.'],['1007','Active shipment','Can you check the status of order 1007?'],['1008','Late delivery','My order 1008 was delivered late. What compensation is available?'],['1009','Refund policy','My order 1009 was delivered on time. Can I get a refund?'],['1010','Cancelled order','My order 1010 was cancelled. What happened to my refund?'],['1011','Two-day delay','My order 1011 is two days late. Can I get a refund?']];
function setMode(m){mode=m;$('single').classList.toggle('active',m==='single');$('multi').classList.toggle('active',m==='multi');$('pill').textContent=m==='multi'?'Multi-Agent':'Single Agent';$('desc').textContent=m==='multi'?'Supervisor → Order → Resolution → Communication':'Orchestrator → Tools'}$('single').onclick=()=>setMode('single');$('multi').onclick=()=>setMode('multi');
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function format(v){let t=esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'),html='',list=false;for(const raw of t.split(/\n/)){const l=raw.trim();if(l.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+l.slice(2)+'</li>'}else{if(list){html+='</ul>';list=false}if(l)html+='<p>'+l+'</p>'}}if(list)html+='</ul>';return html}
function add(role,text){const m=document.createElement('article');m.className='msg '+role;const a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'You':'AI';const b=document.createElement('div'),h=document.createElement('div'),tm=document.createElement('span'),bubble=document.createElement('div');h.className='head';h.textContent=role==='user'?'You':'Support Agent';tm.className='time';tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});h.append(tm);bubble.className='bubble';role==='user'?bubble.textContent=text:bubble.innerHTML=format(text);b.append(h,bubble);m.append(a,b);messages.append(m);m.scrollIntoView({behavior:'smooth'})}
function loading(){const m=document.createElement('article');m.className='msg';m.innerHTML='<div class="avatar">AI</div><div><div class="head">Support Agent</div><div class="loading"><span class="spinner"></span><b id="lt">Analyzing request…</b><div class="bar"><i></i></div></div></div>';messages.append(m);let i=0,s=mode==='multi'?['Analyzing request…','Investigating order…','Checking policy and approval…','Preparing response…']:['Analyzing request…','Calling tools…','Checking policy…','Preparing response…'];m._timer=setInterval(()=>{$('lt').textContent=s[Math.min(++i,s.length-1)]},1600);return m}
function orderFromPrompt(text){const m=text.match(/(?:order\s*#?\s*)(\d+)/i)||text.match(/#(\d+)/);return m?m[1]:selectedOrder}
async function submit(){const text=input.value.trim();if(!text||send.disabled)return;$('error').textContent='';$('hero').style.display='none';add('user',text);input.value='';send.disabled=true;const l=loading();try{const multi=mode==='multi';const ep=multi?'/api/multi-agent/resolve':'/api/agent/resolve';const orderNumber=orderFromPrompt(text);if(multi&&!orderNumber)throw Error('For Multi-Agent mode, select a demo case or include an order number in your message.');const body=multi?{orderNumber,customerMessage:text}:{message:text};const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Request failed');add('agent',d.response||d.message||'No response returned.');await loadApprovals()}catch(e){$('error').textContent=e.message||'Unable to reach API'}finally{clearInterval(l._timer);l.remove();send.disabled=false}}
$('form').onsubmit=e=>{e.preventDefault();submit()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}};
function renderCases(){const box=$('cases');box.innerHTML='';demoCases.forEach(([n,title,prompt])=>{const b=document.createElement('button');b.className='case';b.dataset.order=n;b.innerHTML='<b>Order #'+n+'</b><br><small>'+esc(title)+'</small>';b.onclick=()=>{selectedOrder=n;document.querySelectorAll('.case').forEach(x=>x.classList.toggle('selected',x===b));input.value=prompt;input.focus()};box.append(b)})}
async function loadApprovals(){try{const r=await fetch('/api/approvals/pending');const data=await r.json();$('approvals').innerHTML=data.length?data.map(a=>`<div class="approval"><b>Refund #${esc(a.orderNumber)} · ₹${a.amount}</b><p>${esc(a.reason)}</p><div class="approval-actions"><button class="approve" onclick="decide('${a.id}','approve')">Approve</button><button class="reject" onclick="decide('${a.id}','reject')">Reject</button></div></div>`).join(''):'<small style="color:#687482">No pending approvals</small>'}catch(e){$('approvals').innerHTML='<small style="color:#fb7185">Could not load approvals</small>'}}
window.decide=async(id,decision)=>{try{const reason=prompt('Optional decision reason:')||'Demo approval decision';const r=await fetch(`/api/approvals/${id}/${decision}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decidedBy:'demo-user',reason})});if(!r.ok)throw Error('Approval action failed');await loadApprovals()}catch(e){alert(e.message)}};window.newChat=()=>{messages.replaceChildren();$('hero').style.display='';input.value='';selectedOrder=null;document.querySelectorAll('.case').forEach(x=>x.classList.remove('selected'));$('error').textContent='';input.focus()};renderCases();loadApprovals();
})();</script></body></html>
