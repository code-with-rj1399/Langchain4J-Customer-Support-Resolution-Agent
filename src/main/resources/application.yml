spring:
  application:
    name: langchain4j-customer-support-resolution
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer_support}
    username: ${DB_USERNAME:customer_support}
    password: ${DB_PASSWORD:customer_support}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

agent:
  enabled: ${AGENT_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
